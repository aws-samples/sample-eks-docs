{{- if not (has "45-platform-secrets.yaml" .Values.excluded) }}
# The platform's own secrets, projected from AWS Secrets Manager rather than created by hand.
#
# WHAT THIS CLOSES. Five components on this path read a Kubernetes Secret their charts do not
# create: valkey's auth, Grafana's admin, and Langfuse's three. Terraform generates the values into
# Secrets Manager and these Applications project them into the cluster, so no Secret is created by
# hand.
#
# WHY A REAL KUBERNETES SECRET AND NOT A MOUNTED FILE. Every consumer is a third-party chart that
# reads `existingSecret`. The CSI driver's `secretObjects` is the only shape that satisfies that
# without forking three charts -- and a synced Secret exists only while a pod mounts its
# SecretProviderClass, which is what the syncer Deployment in gitops/charts/platform-secrets is for.
# Read that chart's values.yaml before changing any of this.
#
# SYNC WAVES, and they are not interchangeable. The driver and provider are wave **-2**: the driver
# ships the SecretProviderClass CRD, and a class applied before its CRD fails the whole sync rather
# than waiting. The classes and syncers are wave **-1**, before the components that read the Secrets
# -- those are waves 0 to 2 (60-memory, 50-observability, 51-langfuse), and each creates its own
# namespace, which is why this chart creates them first instead of waiting.
---
# ONE APPLICATION FOR BOTH HALVES, and the reason is not tidiness.
#
# The AWS provider chart BUNDLES the driver as a subchart (`secrets-store-csi-driver.install`, true
# by default), and installing them as two releases does not work: the provider chart renders a
# ServiceAccount hardcoded as `secrets-store-csi-driver` and four ClusterRoles with fixed names
# (`secretproviderclasses-admin-role` and friends) that the driver chart also owns. Helm refuses to
# adopt either:
#
#   Unable to continue with install: ClusterRole "secretproviderclasses-admin-role" ... cannot be
#   imported into the current release: invalid ownership metadata ... must equal
#   "secrets-store-csi-driver-provider-aws": current value is "secrets-store-csi-driver"
#
# Those are cluster-scoped, so a separate namespace does not help. One
# release owns both, which is what the chart is built for.
#
# AND IT GETS A SETTING A STANDALONE DRIVER INSTALL DOES NOT. The subchart defaults carry
# `tokenRequests` for `sts.amazonaws.com` AND `pods.eks.amazonaws.com` -- the audience EKS Pod
# Identity issues. Without it the provider has no token to exchange and every mount fails on
# authentication rather than on anything that names the cause.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-store-csi-driver-provider-aws
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: eks-agents-paved-paths
    eks-agents-ai-docs: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: eks-agents
  destination:
    name: eks-agents
    namespace: kube-system

  source:
    repoURL: https://aws.github.io/secrets-store-csi-driver-provider-aws
    chart: secrets-store-csi-driver-provider-aws
    targetRevision: 3.1.4

    helm:
      valuesObject:
        # system-node-critical on BOTH DaemonSets. A DaemonSet added to a running cluster gets no
        # capacity of its own -- EKS Auto Mode provisions for pending pods, and a DaemonSet pod
        # is pinned to a node that already exists -- so on a node whose requests are full the
        # provider and the driver would sit Pending, "No preemption victims found", and that node
        # could mount no secret at all. Every other node agent on EKS Auto Mode (ztunnel,
        # istio-cni, the Pod Identity agent) already runs
        # at this priority, which is what lets it preempt an ordinary pod to get on the node.
        priorityClassName: system-node-critical
        # Values for the bundled driver are nested under its subchart name.
        secrets-store-csi-driver:
          install: true
          linux:
            priorityClassName: system-node-critical

          # THE ONE SETTING THIS DESIGN DEPENDS ON. Without syncSecret the driver mounts files and
          # creates no Kubernetes Secret, so every `existingSecret` consumer stays broken and the
          # symptom is identical to having no secret at all.
          syncSecret:
            enabled: true

          # Off. Rotation here means the driver rewriting the Secret without restarting what reads
          # it, so a rotated password leaves the stored value and the running process disagreeing.
          # Rotate deliberately: change it in Secrets Manager, then restart the consumers.
          enableSecretRotation: false

  syncPolicy:
    # SHORT BACKOFF, on every automated Application. A first attempt that fails because something
    # it needs is not there yet (a CRD, a webhook, a namespace) is the normal case on a new cluster,
    # and the retry is what converges it. With the managed Argo CD's defaults, Applications spend
    # several minutes retrying with backoff that grows to minutes, and a chart that syncs in seconds
    # waits behind them. Capped at 30 s, a transient failure costs seconds; the higher limit keeps the
    # total time a real failure is retried about the same.
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 30s
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: eks-agents-paved-paths
    eks-agents-ai-docs: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: eks-agents
  destination:
    name: eks-agents
    namespace: kube-system

  sources:
    - repoURL: {{ .Values.repo.url }}
      targetRevision: {{ .Values.repo.revision }}
      path: {{ .Values.repo.path }}gitops/charts/platform-secrets
      helm:
        valueFiles:
          # The chart's own defaults. The rendered values below win over them, and they are what
          # carries the Secrets Manager secret names -- without them the chart renders nothing,
          # deliberately, rather than classes naming secrets that do not exist.
          - values.yaml
        # The rendered values (terraform), passed by the root Application.
        values: |
          {{- toYaml .Values.terraform | nindent 10 }}
  syncPolicy:
    # SHORT BACKOFF, on every automated Application. A first attempt that fails because something
    # it needs is not there yet (a CRD, a webhook, a namespace) is the normal case on a new cluster,
    # and the retry is what converges it. With the managed Argo CD's defaults, Applications spend
    # several minutes retrying with backoff that grows to minutes, and a chart that syncs in seconds
    # waits behind them. Capped at 30 s, a transient failure costs seconds; the higher limit keeps the
    # total time a real failure is retried about the same.
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 30s
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
{{- end }}
