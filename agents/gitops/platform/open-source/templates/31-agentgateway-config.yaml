{{- if not (has "31-agentgateway-config.yaml" .Values.excluded) }}
# The gateway's configuration, as a separate Application from the gateway's installation.
#
# Separate on purpose. The install is a version bump reviewed by whoever keeps the platform current.
# This is the organization's egress policy — which model, which destinations, which budget, which
# tools — and it changes on a different cadence, gets a different review, and should be rollback-able
# without touching the data plane.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentgateway-config
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: eks-agents-paved-paths
    eks-agents-ai-docs: "true"
  annotations:
    # After the chart that installs the CRDs this configuration is written against.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: eks-agents

  source:
    repoURL: {{ .Values.repo.url }}
    targetRevision: {{ .Values.repo.revision }}
    path: {{ .Values.repo.path }}gitops/charts/agentgateway-config

    helm:
      valueFiles:
        - values.yaml
      # ignoreMissingValueFiles stays at its default, false, so a missing values file fails the
      # render. Not written out: the EKS Argo CD capability rewrites Application objects and drops
      # a false field, so the root Application would compare Git's false with nothing and stay
      # OutOfSync.
      # The rendered values (terraform), passed by the root Application.
      values: |
        {{- toYaml .Values.terraform | nindent 8 }}
  destination:
    name: eks-agents
    namespace: agentgateway-system

  syncPolicy:
    # SHORT BACKOFF, on every automated Application. A first attempt that fails because something
    # it needs is not there yet (a CRD, a webhook, a namespace) is the normal case on a new cluster,
    # and the retry is what converges it. With the managed Argo CD's defaults, Applications spend
    # several minutes retrying with backoff that grows to minutes, and a chart that syncs in seconds
    # waits behind them. Capped at 30 s, a transient failure costs seconds; the higher limit keeps the
    # total time a real failure is retried about the same.
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 30s
    automated:
      prune: true
      # selfHeal, because every object here is one whose quiet removal widens what an agent can
      # reach. A deleted AgentgatewayPolicy does not stop traffic; it stops refusing it.
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
{{- end }}
