{{- if not (has "50-adot.yaml" .Values.excluded) }}
# The ADOT collector: how an agent's telemetry reaches the GenAI Observability views.
#
# The instrumentation is the same on both paths — the agent emits OpenTelemetry with the GenAI
# semantic conventions. What differs is only the backend, so an agent moved between paths changes
# nothing in its code.
#
# Two things about this path that a platform team misses, and the reason this file is more than a
# chart reference:
#
#   1. AgentCore Observability is not a separate backend from CloudWatch. The telemetry lands in
#      CloudWatch Logs and X-Ray and is read through the GenAI Observability views, which carry the
#      agent's trajectory, per-invocation token counts and tool-call outcomes.
#   2. Reaching those views takes CloudWatch Transaction Search enabled — which
#      terraform/modules/observability-aws does, as three objects rather than one switch — and
#      instrumenting with the ADOT distro, which is this. It does not arrive automatically the way
#      it does for an agent hosted on AgentCore Runtime.
#
# What it still does not close: per-agent cost is two numbers. Compute is allocatable down to the pod
# through split cost allocation data; model spend is attributed by IAM principal, inference profile
# tag or project, and none of those carries a Kubernetes dimension, which these templates cannot
# add.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-operator
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: eks-agents-paved-paths
    eks-agents-ai-docs: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: eks-agents

  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-operator
    targetRevision: 0.129.0

    helm:
      valuesObject:
        manager:
          collectorImage:
            # The ADOT distro, not upstream contrib. This is the image whose exporters write to
            # CloudWatch Logs and X-Ray in the shape the GenAI Observability views read; an upstream
            # collector can emit the same spans and they will not land where the views look.
            repository: public.ecr.aws/aws-observability/aws-otel-collector

        admissionWebhooks:
          certManager:
            # cert-manager, installed by 45-cert-manager.yaml at an earlier sync wave.
            #
            # Not autoGenerateCert, which does not work under GitOps and fails silently: Helm's
            # genCA runs at RENDER time and is not idempotent, so the webhook
            # configurations and the serving-certificate Secret (a pre-install/pre-upgrade hook,
            # applied on a different schedule) end up carrying CAs from different renders. The
            # operator reports Healthy while no collector can be created, because its own webhook
            # rejects the call:
            #
            #   x509: certificate signed by unknown authority
            #   ... "opentelemetry-operator-operator-ca"
            #
            # Restarting the operator does not fix it: the operator does not mint the certificate,
            # Helm does. 45-cert-manager.yaml has the detail.
            enabled: true
          autoGenerateCert:
            enabled: false

  destination:
    name: eks-agents
    namespace: opentelemetry-operator-system

  # THE CA BUNDLE IS INJECTED AT RUNTIME, so Argo CD must not own it.
  #
  # With certManager.enabled above, cert-manager's CA injector patches the CA into both webhook
  # configurations. The chart renders those with an empty caBundle, so with selfHeal on and no
  # exemption here Argo CD reverts the patch and the webhooks cannot be called. Every
  # attempt to create the collector then fails with
  #
  #   Internal error occurred: failed calling webhook "mopentelemetrycollectorbeta.kb.io":
  #   x509: certificate signed by unknown authority (possibly because of "crypto/rsa:
  #   verification error" ... "opentelemetry-operator-operator-ca")
  #
  # and the adot-collector Application sits OutOfSync retrying forever. Nothing names the CA bundle
  # or Argo CD, so it reads as a broken operator install.
  #
  # Same failure mode 55-istio.yaml documents for istiod, which uses managedFieldsManagers. A jq
  # path is used here instead: it is narrower than ignoring every field a manager owns, and
  # index-independent, which matters because the two configurations carry three and four webhooks
  # respectively.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: opentelemetry-operator-mutation
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: opentelemetry-operator-validation
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle

  syncPolicy:
    # SHORT BACKOFF, on every automated Application. A first attempt that fails because something
    # it needs is not there yet (a CRD, a webhook, a namespace) is the normal case on a new cluster,
    # and the retry is what converges it. With the managed Argo CD's defaults, several Applications
    # can each spend minutes retrying with backoff that grows to minutes, and a chart that syncs
    # in seconds waits behind them. Capped at 30 s, a transient failure costs seconds; the
    # higher limit keeps the total time a real failure is retried about the same.
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 30s
    automated:
      # Carries the OpenTelemetryCollector CRD, and pruning a CRD deletes every collector defined
      # against it.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # NOT Replace=true. A replace rewrites the whole webhook configuration rather than merging,
      # which drops the operator's CA patch even with the exemption above -- the exemption stops
      # Argo CD from reporting and healing the difference, it does not stop a wholesale replace
      # from overwriting the object.
---
# The collector itself, as an OpenTelemetryCollector the operator reconciles.
#
# In its own Application so the collector's pipeline — which is configuration a platform team
# iterates on — is separable from the operator's version, which is not.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adot-collector
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: eks-agents-paved-paths
    eks-agents-ai-docs: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: eks-agents

  source:
    repoURL: {{ .Values.repo.url }}
    targetRevision: {{ .Values.repo.revision }}
    path: {{ .Values.repo.path }}gitops/charts/adot-collector

    helm:
      valueFiles:
        - values.yaml
      # ignoreMissingValueFiles stays at its default, false, so a missing values file fails the
      # render. Not written out: the EKS Argo CD capability rewrites Application objects and drops
      # a false field, so an Application that sets it compares Git's false with nothing and stays
      # OutOfSync.
      # The rendered values (terraform), passed by the root Application.
      values: |
        {{- toYaml .Values.terraform | nindent 8 }}
  destination:
    name: eks-agents
    namespace: opentelemetry-operator-system

  syncPolicy:
    # SHORT BACKOFF, on every automated Application. A first attempt that fails because something
    # it needs is not there yet (a CRD, a webhook, a namespace) is the normal case on a new cluster,
    # and the retry is what converges it. With the managed Argo CD's defaults, several Applications
    # can each spend minutes retrying with backoff that grows to minutes, and a chart that syncs
    # in seconds waits behind them. Capped at 30 s, a transient failure costs seconds; the
    # higher limit keeps the total time a real failure is retried about the same.
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 30s
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
