# The destination, and why every Application here names a cluster instead of a URL.
#
# THE EKS CAPABILITY FOR ARGO CD RUNS OFF-CLUSTER. It is not a Deployment in this cluster; the
# Argo CD components run in AWS-managed infrastructure and reach the cluster through an EKS access
# entry for the capability's IAM role. On a fresh cluster, all it creates in the
# cluster is this namespace, the three argoproj CRDs, and a webhook-credentials secret -- no pods,
# and not even a NodeClaim.
#
# So there is no such thing as "the cluster Argo CD is running in", and the usual self-managed
# destination is refused:
#
#   destination:
#     server: https://kubernetes.default.svc
#
#   InvalidSpecError: error getting cluster by server "https://kubernetes.default.svc":
#   cluster "https://kubernetes.default.svc" is disabled
#
# Every Application in gitops/platform and gitops/bootstrap therefore uses `destination.name:
# eks-agents`, and this secret is what makes that name resolve. The name is a LOGICAL HANDLE chosen
# by this repository, not the cluster's real name -- which is the point: 20-odd Applications stay
# portable across clusters and accounts with no substitution, and only this one file carries values
# that differ per deployment.
#
# TWO VALUES ARE NOT UPSTREAM ARGO CD, and neither is in Argo CD's own documentation:
#
#   1. `server` MUST BE THE EKS CLUSTER ARN. Not the API endpoint, not a name. An endpoint URL is
#      rejected with "error getting cluster RESTConfig: server should be specified as a cluster
#      ARN". No upstream Argo CD accepts an ARN there, so nothing in Argo CD's own documentation
#      suggests trying it.
#   2. `awsAuthConfig.clusterName` is how the managed instance authenticates to the cluster, using
#      the capability's own role rather than any credential stored here.
#
# AND THE CONTROLLER CACHES CLUSTERS BY THE `server` VALUE IT FIRST SAW. Correcting this field in
# place does not take effect -- the error keeps naming the old value. Delete this secret and the
# Applications that referenced it, wait for the cache to drop, then re-apply.
#
# BOOTSTRAP ORDER. This cannot be delivered by Argo CD, because no Application can resolve a
# destination until it exists. Apply it by hand, or from whatever runs terraform, BEFORE the
# root-app:
#
#   1. terraform apply        (creates the cluster and the ARGOCD capability, and renders
#                              cluster-secret.local.yaml, appproject.local.yaml and root-app.local.yaml)
#   2. cluster-secret.yaml    (this file, with the placeholders filled in)
#   3. appproject.yaml
#   4. root-app.yaml          (with the values files folded in)
#
# scripts/bootstrap-gitops.sh applies the three in that order.
#
# Step 1 also associates an EKS access policy with the capability role -- see
# `argocd_cluster_access_policy_arn` in terraform/modules/agent-cluster. Without it the capability
# can see only its own namespace and the cluster cache never builds, which surfaces as a
# ComparisonError naming whatever API resource it failed to list first.
#
# A HUB MANAGING MANY CLUSTERS would hold one of these per spoke, each with its own logical name,
# and the Applications would be templated by an ApplicationSet over those names rather than naming
# one. That is a different topology from this repository's single-cluster path; the fixed name here
# is a deliberate simplification, not an assumption that it scales.
#
# Fill in both placeholders from terraform, or read them with:
#
#   aws eks describe-cluster --name <cluster> --region <region> \
#     --query 'cluster.{arn:arn,ca:certificateAuthority.data}'
apiVersion: v1
kind: Secret
metadata:
  name: eks-agents-destination
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: eks-agents-paved-paths
    eks-agents-ai-docs: "true"

    # What makes the managed Argo CD read this at all. The capability honours Argo CD's declarative
    # configuration convention -- labelled secrets in its own namespace -- and writes one itself with
    # `secret-type: webhook`. That is the whole reason none of this needs the Argo CD UI or an API
    # token: configuration is the Kubernetes API, and only minting Argo CD tokens needs a browser.
    argocd.argoproj.io/secret-type: cluster
stringData:
  # The logical handle every Application refers to. Changing it means changing them all; leave it.
  name: eks-agents

  # THE CLUSTER ARN. See note 1 above.
  server: CLUSTER_ARN

  config: |
    {
      "awsAuthConfig": { "clusterName": "CLUSTER_NAME" },
      "tlsClientConfig": { "insecure": false, "caData": "CLUSTER_CA_DATA" }
    }
