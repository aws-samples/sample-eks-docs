{{/*
THE PLACEHOLDER VALUES FILE MUST NOT RENDER AN EMPTY RELEASE.

gitops/base refuses to render when `accountId` is still the committed placeholder, for the same
reason: a chart installed against that file produces objects pointing at nothing. This chart's
failure is quieter and worse. With no `platformSecrets` block at all -- which is what the placeholder
has -- `enabled` falls back to false, every template renders nothing, and `helm upgrade` PRUNES what
the previous revision created: the classes, the syncers, and with the syncers the five Secrets they
own.

When the Secrets exist and a later install carries the placeholder file, valkey then fails to
start with `secret "valkey-auth" not found` minutes later, in a different namespace from anything
the install touched.

So an unrendered accountId is a hard stop here too. `platformSecrets.enabled: false` with a REAL
values file is still a legitimate opt-out, and still renders nothing -- the difference is that it is
a choice rather than an accident.
*/}}
{{- if eq (.Values.accountId | default "ACCOUNT_ID_NOT_SET") "ACCOUNT_ID_NOT_SET" }}
{{- fail "accountId is still the placeholder. This chart owns the Kubernetes Secrets five components read, and rendering it against the committed placeholder file prunes them -- the components then fail with `secret not found` long after the install. Pass the terraform-values.yaml your path's Terraform rendered." }}
{{- end }}
{{- if .Values.platformSecrets.enabled }}
{{/*
FAIL RATHER THAN RENDER NOTHING. `enabled` is turned on by Terraform in the same breath as it writes
the Secrets Manager names, so enabled-with-an-empty-name means the values file is not the one
Terraform rendered -- the committed placeholder, most likely. Skipping the class quietly produces a
release that reports `deployed` with no classes, no syncers and no Secrets, and the components that
read them wait forever with nothing naming the cause. That is exactly what a placeholder values
file reaching a cluster produces.
*/}}
{{- range $name, $spec := .Values.platformSecrets.secrets }}
{{- if not $spec.secretsManagerName }}
{{- fail (printf "platformSecrets.enabled is true but secrets.%s.secretsManagerName is empty. Pass the terraform-values.yaml your path's Terraform rendered -- the committed copy is a placeholder. Set platformSecrets.enabled=false to create the five Secrets yourself." $name) }}
{{- end }}
{{- end }}
{{- range $name, $spec := .Values.platformSecrets.secrets }}
{{- if $spec.secretsManagerName }}
---
{{/*
THE SECRET A THIRD-PARTY CHART READS, PROJECTED FROM SECRETS MANAGER.

Every one of these five is consumed by a third-party chart -- valkey, Grafana, Langfuse -- through
an `existingSecret` reference. So a mounted file is not enough: there has to be a real Kubernetes
Secret with the right name and keys, which is what `secretObjects` below produces.

THE CONSTRAINT TO UNDERSTAND BEFORE RELYING ON THIS. The CSI driver creates and maintains the
synced Secret only while a POD MOUNTS this SecretProviderClass. Nothing in the consumer charts
mounts it, and patching three third-party charts to add a volume would be worse than this: so
`templates/syncer.yaml` runs one tiny pod per namespace whose whole job is to hold the mount open.

What that means operationally, stated rather than discovered: if the syncer pod is evicted and does
not come back, the Secret it owns is garbage collected, and the component that reads it fails on its
NEXT restart rather than immediately. The syncer therefore carries a PodDisruptionBudget against
voluntary disruption. It sets no priorityClassName, so it runs at the cluster's default priority
and a higher-priority pod can preempt it; `kubectl get secret <name> -n <ns>` is the check that it
is doing its job.
*/}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ $name }}
  namespace: {{ $spec.namespace }}
  labels:
    app.kubernetes.io/part-of: eks-agents-paved-paths
    eks-agents-ai-docs: "true"
    app.kubernetes.io/managed-by: platform-secrets
spec:
  provider: aws
  parameters:
    # POD IDENTITY, NOT IRSA, and this parameter is what chooses it. Omitted, the provider defaults
    # to IRSA: it reads an `eks.amazonaws.com/role-arn` annotation off the service account, finds
    # none, and every mount fails with
    #
    #   An IAM role must be associated with service account platform-secrets (namespace: ...)
    #
    # which names neither Pod Identity nor the parameter that would have used it, even with the
    # associations present and correct the whole time.
    #
    # Pod Identity is the right mechanism here -- it is what every other AWS identity in this stack
    # uses, and it needs no OIDC trust policy per service account. It requires EKS 1.24+, the Pod
    # Identity Agent add-on (EKS Auto Mode runs it), and the role in the cluster's own account.
    usePodIdentity: {{ $.Values.platformSecrets.usePodIdentity | quote }}
    # One Secrets Manager secret holding a JSON document, with one jmesPath entry per key the
    # Kubernetes Secret needs. The alternative -- one Secrets Manager secret per key -- turns five
    # secrets into eleven and five IAM statements into eleven.
    objects: |
      - objectName: {{ $spec.secretsManagerName | quote }}
        objectType: secretsmanager
        jmesPath:
          {{- range $key := $spec.keys }}
          {{/*
          THE PATH IS A JMESPATH EXPRESSION, SO A HYPHENATED KEY HAS TO BE QUOTED INSIDE IT.
          JMESPath reads `admin-user` as a subtraction -- `admin` minus `user` -- and matches
          nothing. Quoting it in YAML is not enough, because YAML strips those quotes before the
          provider ever sees the string: the expression itself must contain them, which is what
          printf %q produces.

          The symptom names none of this: every secret whose keys are single words syncs, and every
          secret with a hyphenated key fails with
          `Failed to fetch secret from all regions. Verify secret exists and required permissions
          are granted for: <name>` -- a message about existence and IAM, for a parse error, while
          the secret exists and the IAM policy names its exact ARN.
          */}}
          - path: '{{ printf "%q" $key }}'
            objectAlias: {{ $key | quote }}
          {{- end }}

  # What makes a Kubernetes Secret exist. `type: Opaque` unless the secret names one (the memory
  # tier's login is kubernetes.io/basic-auth, which CloudNativePG requires), and one data entry per key, each reading
  # the objectAlias above rather than the Secrets Manager name.
  secretObjects:
    - secretName: {{ $name }}
      type: {{ $spec.type | default "Opaque" }}
      labels:
        app.kubernetes.io/part-of: eks-agents-paved-paths
        eks-agents-ai-docs: "true"
        {{- with $spec.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      data:
        {{- range $key := $spec.keys }}
        - objectName: {{ $key | quote }}
          key: {{ $key | quote }}
        {{- end }}
{{- end }}
{{- end }}
{{- end }}
