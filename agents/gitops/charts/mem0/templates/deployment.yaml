{{- if not .Values.image.repository }}
{{ fail "image.repository is required and is deliberately empty. The published mem0/mem0-api-server image has only a latest tag, so it cannot be pinned to a version or rebuilt with the source's dependency fixes. Build from source into your own ECR and set this, or use mem0ai as a library in the agent and do not deploy this chart. See values.yaml." }}
{{- end }}
{{- if not .Values.image.tag }}
{{ fail "image.tag is required: set it to the upstream commit you built from. The project tags PyPI releases but not server images, so the commit is the only honest version string." }}
{{- end }}
{{- if not .Values.llm.baseUrl }}
{{ fail "llm.baseUrl is required. Mem0 calls a model to consolidate, and on this stack every model call goes through the egress gateway so that no component holds a model credential and the spend lands in one budget and audit point. Point it at the gateway." }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mem0
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: eks-agents-paved-paths
    eks-agents-ai-docs: "true"
    app.kubernetes.io/name: mem0
# Mem0 has no reason to call the Kubernetes API.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mem0
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: eks-agents-paved-paths
    eks-agents-ai-docs: "true"
    app.kubernetes.io/name: mem0
    eks-agents/memory-rung: consolidation
spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app.kubernetes.io/name: mem0

  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: eks-agents-paved-paths
        eks-agents-ai-docs: "true"
        app.kubernetes.io/name: mem0
    spec:
      serviceAccountName: mem0
      enableServiceLinks: false

      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      containers:
        - name: mem0
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP

          env:
            # The stores, from a Secret rather than a chart value, because both are connection
            # strings carrying a password.
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.postgresUrlKey | quote }}
            - name: VECTOR_STORE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.vectorUrlKey | quote }}

            # The model, through the gateway. OPENAI_BASE_URL rather than a Bedrock region and model
            # ID: Mem0 speaks the OpenAI API, the gateway translates and signs, and so Mem0 holds no
            # model credential of its own.
            - name: OPENAI_BASE_URL
              value: {{ .Values.llm.baseUrl | quote }}
            - name: OPENAI_API_KEY
              value: {{ .Values.llm.apiKeyPlaceholder | quote }}
            - name: MEM0_LLM_MODEL
              value: {{ .Values.llm.model | quote }}

            - name: OTEL_SERVICE_NAME
              value: mem0

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - { name: tmp, mountPath: /tmp }

          # Readiness only, deliberately no liveness probe. Mem0's work is a model call per
          # consolidation, which can be slow; a liveness probe that trips during one restarts the
          # pod mid-consolidation and loses it.
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mem0
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: eks-agents-paved-paths
    eks-agents-ai-docs: "true"
    app.kubernetes.io/name: mem0
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mem0
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
