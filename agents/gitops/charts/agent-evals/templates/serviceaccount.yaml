{{- if .Values.evals.enabled }}
{{- include "agent-evals.guards" . }}
---
# The runner's identity, and the judge's. The gateway authorizes /judge/<name> for exactly this
# subject, and on the AWS path EKS Pod Identity binds the CloudWatch role to it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.evals.serviceAccount }}
  namespace: {{ .Values.evals.namespace }}
  labels:
    app.kubernetes.io/part-of: eks-agents-paved-paths
    eks-agents-ai-docs: "true"
    app.kubernetes.io/name: agent-evals
# Off: the runner needs no Kubernetes API access, and its only credentials are the projected,
# audience-bound tokens in the pod template.
automountServiceAccountToken: false
{{- end }}
